<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDG ORNET</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Share Tech Mono',monospace;}
body{background:#000;color:#00ff88;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:25px;}
h1{font-size:1.7em;text-align:center;margin:25px 0;text-shadow:0 0 20px #00ff88;letter-spacing:3px;}
.sub{color:#666;font-size:0.7em;margin-bottom:25px;}
form{width:100%;max-width:380px;display:flex;gap:8px;}
form input{flex:1;padding:18px;background:#0f0f1a;border:2px solid #00ff88;border-radius:12px;color:#00ff88;font-size:18px;outline:none;}
form button{width:60px;background:#00ff88;color:#000;border:none;border-radius:12px;font-size:22px;font-weight:bold;}
.nodes{display:flex;align-items:center;width:100%;max-width:380px;margin:35px 0;justify-content:space-between;}
.node{width:60px;height:60px;border-radius:50%;border:2px solid #333;background:#111;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:0.3s;}
.node.active{border-color:#00ff88;box-shadow:0 0 25px #00ff88;transform:scale(1.2);background:#002211;}
.node.done{background:#00ff88;color:#000;border-color:#00ff88;}
.node span{font-size:10px;}
.line{flex:1;height:3px;background:#222;}
.line.active{background:#00ff88;}
#status{color:#00ff88;margin-top:10px;font-size:14px;height:20px;}
#log{width:100%;max-width:380px;background:#0a0a0a;border:1px solid #222;border-radius:10px;padding:12px;margin-top:15px;font-size:12px;color:#888;min-height:90px;}
#log .ok{color:#00ff88;}
</style>
</head>
<body>
<h1>🔒 E.D.G. ORNET<br>4-NODI</h1>
<div class="sub">RICERCA GOOGLE ANONIMA</div>

<form id="searchForm">
<input id="q" type="search" placeholder="Cerca..." enterkeyhint="search" autocomplete="off">
<button type="submit">▶</button
