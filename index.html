<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
  const KEYS = [
    "EDG_Rospo_2024_Segreto",
    "STODS",
    "okoiwedk",
    "Nddindd",
    "swswswswswswswswswswswswsws",
    "wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwdddddddddddddddddd,
    "wjkjwkwkwkwkwkwkwkwkwkkkwwwkwwwkwkwkwkwkw",
    "llllllllloopppppoollll",
    "kiotisert"
  ];
  function criptaEDG(t){
    let c=t; for(let k of KEYS){ c=CryptoJS.AES.encrypt(c,k).toString(); } return c;
  }
  function decriptaEDG(c){
    for(let i=KEYS.length-1;i>=0;i--){ c=CryptoJS.AES.decrypt(c,KEYS[i]).toString(CryptoJS.enc.Utf8); } return c;
  }
  console.log("✅ E.D.G. LIVELLO 9 ATTIVO");
</script>
