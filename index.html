<!-- PROTOCOLLO E.D.G. PENTA CRITTOGRAFIA - LIVELLO 5 ULTRA -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
  const K1 = "EDG_Rospo_2024_Segreto";
  const K2 = "STODS";
  const K3 = "okoiwedk";
  const K4 = "Nddindd";
  const K5 = "Kenekendndoeekkened";
  
  function criptaEDG(testo){
    let c = CryptoJS.AES.encrypt(testo, K1).toString();
    c = CryptoJS.AES.encrypt(c, K2).toString();
    c = CryptoJS.AES.encrypt(c, K3).toString();
    c = CryptoJS.AES.encrypt(c, K4).toString();
    c = CryptoJS.AES.encrypt(c, K5).toString();
    console.log("🔐 PENTA-CRIPTATO LIVELLO 5:", c);
    return c;
  }
  function decriptaEDG(cifrato){
    try{
      let c = CryptoJS.AES.decrypt(cifrato, K5).toString(CryptoJS.enc.Utf8);
      c = CryptoJS.AES.decrypt(c, K4).toString(CryptoJS.enc.Utf8);
      c = CryptoJS.AES.decrypt(c, K3).toString(CryptoJS.enc.Utf8);
      c = CryptoJS.AES.decrypt(c, K2).toString(CryptoJS.enc.Utf8);
      c = CryptoJS.AES.decrypt(c, K1).toString(CryptoJS.enc.Utf8);
      console.log("🔓 DECRIPTATO:", c);
      return c;
    }catch(e){
      console.error("❌ Mancano chiavi: ROSPO + STODS + okoiwedk + Nddindd + Kenekendndoeekkened");
      return null;
    }
  }
  console.log("✅ E.D.G. PROTOCOLLO LIVELLO 5 ATTIVO");
</script>
