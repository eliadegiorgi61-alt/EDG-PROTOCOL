<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E.D.G. ORNET - 4 NODI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Share Tech Mono',monospace;}
body{background:#000;color:#00ff88;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;}
h1{font-size:1.6em;text-align:center;margin:20px 0;text-shadow:0 0 20px #00ff88;letter-spacing:3px;line-height:1.3;}
.sub{color:#888;font-size:0.65em;margin-bottom:20px;text-align:center;}
.search-box{width:100%;max-width:400px;position:relative;margin:15px 0;display:flex;gap:8px;}
.search-box input{flex:1;padding:16px;background:#0a0a14;border:2px solid #00ff88;border-radius:10px;color:#00ff88;font-size:1em;outline:none;box-shadow:0 0 15px rgba(0,255,136,0.3);}
.search-box button.go{width:50px;background:#00ff88;color:#000;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:1.3em;}
.engines{width:100%;max-width:400px;display:flex;gap:8px;margin:10px 0;}
.engines button{flex:1;padding:12px;border-radius:10px;border:2px solid #00ff88;background:#000;color:#00ff88;cursor:pointer;font-size:0.85em;}
.engines button:active{background:#00ff88;color:#000;}
.nodes{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:400px;margin:25px 0;}
.node{width:55px;height:55px;border-radius:50%;border:2px solid #333;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 0.4s;font-size:1.2em;}
.node.active{border-color:#00ff88;background:#0a2215;box-shadow:0 0 20px #00ff88;transform:scale(1.15);}
.node.done{border-color:#00ff88;background:#00ff88;color:#000;}
.node span{font-size:0.4em;}
.line{flex:1;height:2px;background:#222;}
.line.active{background:#00ff88;box-shadow:0 0 10px #00ff88;}
.status{margin-top:12px;font-size:0.85em;text-align:center;min-height:20px;color:#00ff88;}
.log{width:100%;max-width:400px;background:#08080f;border:1px solid #222;border-radius:10px;padding:12px;min-height:110px;font-size:0.75em;color:#aaa;margin-top:12px;text-align:left;}
.log div{margin:3px 0;}
.log div.ok{color:#00ff88;}
</style>
</head>
<body>
<h1>🔒 E. D. G. ORNET<br>4-NODI PROTOCOL</h1>
<div class="sub">PIU' SICURO DEL PENTAGONO // GOOGLE + WIKI + SAFARI</div>

<div class="search-box">
<input id="q" type="text" placeholder="Scrivi... es: Justin biber" autocomplete="off">
<button class="go" id="goBtn">▶</button>
</div>

<div class="engines">
<button id="googleBtn">🔵 GOOGLE</button>
<button id="wikiBtn">📚 WIKI</button>
<button id="safariBtn">🧭 SAFARI</button>
</div>

<div class="nodes">
<div class="node" id="n1">🇺🇸<span>USA</span></div>
<div class="line" id="l1"></div>
<div class="node" id="n2">🇨🇭<span>CH</span></div>
<div class="line" id="l2"></div>
<div class="node" id="n3">🇮🇸<span>IS</span></div>
<div class="line" id="l3"></div>
<div class="node" id="n4">🇵🇦<span>PA</span></div>
</div>

<div class="status" id="status">Pronto - Scrivi e premi INVIO o GOOGLE</div>
<div class="log" id="log"><div>> ORNET pronto...</div></div>

<script>
let engine='google';
const qInput=document.getElementById('q');
const statusEl=document.getElementById('status');
const logEl=document.getElementById('log');

function log(m,c=''){const d=document.createElement('div');d.textContent='> '+m;if(c)d.className=c;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function resetNodes(){for(let i=1;i<=4;i++){document.getElementById('n'+i).className='node';document.getElementById('l'+i)?.classList.remove('active');}}

async function doORNET(){
let query=qInput.value.trim();
if(!query){alert('Scrivi qualcosa!');qInput.focus();return;}
resetNodes();logEl.innerHTML='';log('Query: '+query,'ok');log('Avvio 4 nodi...');
statusEl.textContent='Cifratura in corso...';
const steps=[1,2,3,4];
for(let i of steps){
let n=document.getElementById('n'+i);
let l=document.getElementById('l'+i);
n.classList.add('active');
if(l) l.classList.add('active');
statusEl.textContent='Rimbalzo '+i+'/4 -> Nodo '+i;
log('Nodo '+i+' cifrato OK','ok');
await sleep(500);
n.classList.add('done');
}
statusEl.textContent='✅ Tunnel OK! Apro '+engine.toUpperCase();
await sleep(400);
// FIX: usa location.href invece di window.open che iPhone blocca
let url='';
if(engine==='google') url='https://www.google.com/search?q='+encodeURIComponent(query);
if(engine==='wiki') url='https://it.wikipedia.org/w/index.php?search='+encodeURIComponent(query);
if(engine==='safari') url='https://duckduckgo.com/?q='+encodeURIComponent(query);
log('Apro: '+url,'ok');
// apre nella stessa pagina su iPhone per evitare blocco popup
window.location.href=url;
}

// TASTI FIXATI
document.getElementById('goBtn').addEventListener('click', doORNET);
document.getElementById('googleBtn').addEventListener('click', ()=>{engine='google';doORNET();});
document.getElementById('wikiBtn').addEventListener('click', ()=>{engine='wiki';doORNET();});
document.getElementById('safariBtn').addEventListener('click', ()=>{engine='safari';doORNET();});

// TASTO INVIO FIXATO
qInput.addEventListener('keydown', function(e){
if(e.key==='Enter'){
e.preventDefault();
doORNET();
}
});
qInput.addEventListener('focus', ()=>{statusEl.textContent='Scrivi e premi INVIO';});
</script>
</body>
</html>
