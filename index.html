<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<script>
  const CHIAVE_ROSPO = "EDG_Rospo_2024_Segreto";
  
  function criptaEDG(testo){
    return CryptoJS.AES.encrypt(testo, CHIAVE_ROSPO).toString();
  }
  function decriptaEDG(testoCifrato){
    return CryptoJS.AES.decrypt(testoCifrato, CHIAVE_ROSPO).toString(CryptoJS.enc.Utf8);
  }
  
  // TEST: 
  // criptaEDG("ciao") -> ti da codice illeggibile
  // decriptaEDG(codice) -> torna "ciao"
</script>
