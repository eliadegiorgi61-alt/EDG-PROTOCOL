<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#fff;min-height:100vh;display:flex;flex-direction:column;}
.top{padding:15px;display:flex;justify-content:flex-end;gap:15px;font-size:13px;color:#202124;align-items:center;}
.top a{color:#202124;text-decoration:none;}
.top .apps{width:24px;height:24px;background:#f1f3f4;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.top .user{width:32px;height:32px;background:#8e24aa;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;margin-top:-80px;}
.logo{font-size:90px;font-weight:400;letter-spacing:-5px;margin-bottom:25px;line-height:1;}
.logo span:nth-child(1){color:#4285f4;} .logo span:nth-child(2){color:#ea4335;}
.logo span:nth-child(3){color:#fbbc05;} .logo span:nth-child(4){color:#4285f4;}
.logo span:nth-child(5){color:#34a853;} .logo span:nth-child(6){color:#ea4335;}
.badge{font-size:11px;color:#fff;background:#000;padding:4px 10px;border-radius:12px;margin-top:-20px;margin-bottom:20px;letter-spacing:1px;}
form{width:100%;max-width:584px;position:relative;}
.search-box{width:100%;display:flex;align-items:center;border:1px solid #dfe1e5;border-radius:24px;padding:0 14px;height:52px;box-shadow:0 1px 6px rgba(32,33,36,0.28);}
.search-box:hover{box-shadow:0 2px 8px rgba(32,33,36,0.28);}
.search-box input{flex:1;border:none;outline:none;font-size:16px;padding:0 10px;}
.icon{color:#9aa0a6;font-size:18px;}
.buttons{margin-top:30px;display:flex;gap:12px;justify-content:center;}
.buttons button{background:#f8f9fa;border:1px solid #f8f9fa;padding:10px 20px;border-radius:4px;color:#3c4043;font-size:14px;cursor:pointer;}
.buttons button:hover{border-color:#dadce0;box-shadow:0 1px 1px rgba(0,0,0,0.1);}
.nodes{display:none;margin-top:25px;align-items:center;gap:8px;}
.nodes.show{display:flex;}
.node{width:38px;height:38px;border-radius:50%;border:2px solid #e0e0e0;display:flex;align-items:center;justify-content:center;font-size:16px;background:#fff;transition:0.3s;}
.node.active{border-color:#4285f4;background:#e8f0fe;transform:scale(1.15);box-shadow:0 0 10px rgba(66,133,244,0.4);}
.node.done{border-color:#34a853;background:#34a853;color:#fff;}
.line{width:20px;height:2px;background:#e0e0e0;}
.line.active{background:#4285f4;}
#status{margin-top:12px;font-size:13px;color:#70757a;height:18px;}
.footer{background:#f2f2f2;padding:15px;color:#70757a;font-size:14px;display:flex;justify-content:space-between;border-top:1px solid #dadce0;}
</style>
</head>
<body>
<div class="top"><a>Gmail</a><a>Immagini</a><div class="apps">⋮⋮⋮</div><div class="user">E</div></div>

<div class="center">
<div class="logo"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
<div class="badge">🔒 E.D.G. ORNET - 4 NODI SICURI</div>

<form id="searchForm">
<div class="search-box">
<span class="icon">🔍</span>
<input id="q" type="search" autocomplete="off" enterkeyhint="search">
<span class="icon">🎤</span><span class="icon" style="margin-left:10px;">📷</span>
</div>
<div class="buttons">
<button type="submit">Cerca con Google</button>
<button type="button" id="lucky">Mi sento fortunato</button>
</div>
</form>

<div class="nodes" id="nodes">
<div class="node" id="n1">🇺🇸</div><div class="line" id="l1"></div>
<div class="node" id="n2">🇨🇭</div><div class="line" id="l2"></div>
<div class="node" id="n3">🇮🇸</div><div class="line" id="l3"></div>
<div class="node" id="n4">🇵🇦</div>
</div>
<div id="status"></div>
</div>

<div class="footer"><span>Italia</span><span>EDG Protocol - Più sicuro del Pentagono</span></div>

<script>
const form=document.getElementById('searchForm');
const q=document.getElementById('q');
const nodes=document.getElementById('nodes');
const status=document.getElementById('status');
function sleep(m){return new Promise(r=>setTimeout(r,m));}

async function doGoogle(e){
if(e) e.preventDefault();
let query=q.value.trim();
if(!query) return false;
nodes.classList.add('show');
status.textContent='🔒 Cifratura 4-nodi in corso...';
for(let i=1;i<=4;i++){document.getElementById('n'+i).className='node';document.getElementById('l'+i)?.classList.remove('active');}
for(let i=1;i<=4;i++){
let n=document.getElementById('n'+i);
let l=document.getElementById('l'+i);
n.classList.add('active');
if(l) l.classList.add('active');
status.textContent='Nodo '+i+'/4 - Tunnel sicuro...';
await sleep(500);
n.classList.remove('active');
n.classList.add('done');
}
status.textContent='✅ Sicuro - Apro Google';
await sleep(400);
window.location.href='https://www.google.com/search?q='+encodeURIComponent(query);
return false;
}
form.addEventListener('submit', doGoogle);
document.getElementById('lucky').addEventListener('click', doGoogle);
</script>
</body>
</html>
