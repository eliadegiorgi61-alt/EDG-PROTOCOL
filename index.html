<!-- SCUDO ANTI-TROJAN / ANTI-DDoS / ANTI-HACKING -->
<script>
  // 1. ANTI-TROJAN - Blocca incolla di script esterni
  document.addEventListener('paste', e => {
    let t = (e.clipboardData || window.clipboardData).getData('text');
    if(t.includes('<script') || t.includes('eval(')){
      e.preventDefault();
      alert('⛔ TROJAN RILEVATO E BLOCCATO!');
    }
  });

  // 2. ANTI-DDoS - Blocca troppi click / richieste
  let reqCount = 0;
  setInterval(()=>{ reqCount=0; }, 1000);
  document.addEventListener('click', ()=>{
    reqCount++;
    if(reqCount > 20){
      alert('⛔ ATTACCO DDoS BLOCCATO!');
      location.reload();
    }
  });

  // 3. ANTI-HACKING - Blocca F12 / ispezione
  document.addEventListener('contextmenu', e=>e.preventDefault());
  document.onkeydown = e => {
    if(e.keyCode==123 || (e.ctrlKey && e.shiftKey && (e.keyCode==73 || e.keyCode==74)) || (e.ctrlKey && e.keyCode==85)){
      e.preventDefault();
      console.log('⛔ HACKING BLOCCATO!');
      return false;
    }
  };

  // 4. ANTI-XSS - Pulisce tutti gli input
  function pulisciInput(s){
    return s.replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/script/gi,"");
  }

  // 5. FIREWALL - Blocca IP sospetti (simulato)
  console.log("🛡️ FIREWALL E.D.G. ATTIVO - SITO INVINCIBILE");
</script>
