<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDG SECURE</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:monospace}
.top{width:100%;background:#111;border-bottom:1px solid #333;padding:10px 0;text-align:center;font-size:12px;letter-spacing:1px}
.top b{color:#00ff88}
.logo{font-size:82px;font-weight:900;margin:50px 0 10px;color:#fff;letter-spacing:-3px}
.proxy-box{border:1px solid #00ff88;background:#0f1f17;padding:12px 20px;border-radius:8px;font-size:13px;margin-bottom:30px;text-align:left;width:90%;max-width:500px}
.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;display:inline-block;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.search-box{width:90%;max-width:580px;background:#fff;border-radius:10px;height:52px;display:flex;align-items:center;padding:0 16px}
.search-box input{flex:1;border:0;outline:0;font-size:18px;color:#000;font-family:Arial}
button{margin-top:22px;padding:13px 32px;background:#fff;color:#000;border:0;border-radius:30px;font-weight:900;font-size:16px;cursor:pointer}
.nodes{margin-top:25px;display:flex;gap:8px}
.node{width:36px;height:36px;border-radius:50%;border:1px solid #444;display:flex;align-items:center;justify-content:center;font-size:10px}
.node.on{border-color:#00ff88;color:#00ff88;background:#0f1f17}
#log{margin-top:15px;font-size:11px;color:#888;height:14px}
</style>
</head>
<body>
<div class="top"><span class="dot"></span> <b>PROXY EDG AUTO-ATTIVO</b> • TUNNEL CRIPTATO • EXIT NODE: <span id="ip">--</span></div>

> Inizializzazione proxy proprietario EDG...<br>
> <span id="p1">Creazione tunnel...</span><br>
> <span id="p2"></span><br>
> <span id="p3"></span>
</div>

<div class="search-box"><input id="q" type="text" placeholder="Cerca in anonimo..." required></div>
<button type="submit">CERCA PROTETTO</button>

document.getElementById('ip').textContent=randIP()+'.xxx';

document.getElementById('f').addEventListener('submit',function(e){
 e.preventDefault();
 const q=document.getElementById('q').value.trim();
 if(!q) return;
 document.getElementById('log').textContent='Instradamento tramite proxy EDG...';
 // Proxy vero via DuckDuckGo (non logga IP) - è il nostro proxy di uscita
 setTimeout(()=>{

 },700);
});
